services:
  lexos-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./gateway:/app
    depends_on:
      redis:
        condition: service_healthy
      lexos-minio-init:
        condition: service_completed_successfully
    environment:
      - REDIS_URL=${REDIS_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=${S3_USE_SSL}
      - S3_REGION=${S3_REGION}
      - S3_AUTO_CREATE_BUCKET=${S3_AUTO_CREATE_BUCKET}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS}
      - TASK_TTL_SECONDS=${TASK_TTL_SECONDS}
      - PROCESSING_LOCK_TTL_SECONDS=${PROCESSING_LOCK_TTL_SECONDS}

  lexos-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - ./worker:/app
      - ./models:/models
    depends_on:
      redis:
        condition: service_healthy
      lexos-minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    environment:
      - REDIS_URL=${REDIS_URL}
      - OMP_NUM_THREADS=2
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=${S3_USE_SSL}
      - S3_REGION=${S3_REGION}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS}
      - TASK_TTL_SECONDS=${TASK_TTL_SECONDS}

  lexos-minio:
    image: minio/minio:latest
    container_name: lexos-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  lexos-minio-init:
    image: minio/mc:latest
    depends_on:
      lexos-minio:
        condition: service_started
    volumes:
      - ./infra/lifecycle.json:/config/lifecycle.json:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set lexos http://lexos-minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing lexos/${S3_BUCKET} &&
      mc ilm rule import lexos/${S3_BUCKET} < /config/lifecycle.json
      "

  redis:
    image: redis:8.8.0-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lexos-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_GITHUB_URL=${NEXT_PUBLIC_GITHUB_URL}
    depends_on:
      - lexos-gateway

volumes:
  minio_data:
  redis_data: